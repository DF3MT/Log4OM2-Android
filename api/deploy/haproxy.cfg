global
  log stdout format raw
  maxconn 4096

defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  option httplog
  option dontlognull
  # No HTTP cache — apps set Cache-Control: no-store for auth/data

frontend fe_https
  bind *:443 ssl crt /etc/haproxy/certs/cert.pem
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Host %[req.hdr(Host)]
  use_backend be_api if { path_beg /auth /me /qsos /adif /stats /lookup /actuator /v3 /swagger-ui }
  default_backend be_web

backend be_api
  balance roundrobin
  option httpchk GET /actuator/health
  http-check expect status 200
  http-response set-header Cache-Control "no-store" if { path_beg /auth /me /qsos /adif /stats /lookup }
  server api1 api1:8080 check
  server api2 api2:8080 check

backend be_web
  balance roundrobin
  option httpchk GET /
  server web1 web1:3000 check
  server web2 web2:3000 check
