name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      tag: ${{ steps.meta.outputs.tag }}
      apk_name: ${{ steps.meta.outputs.apk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"
              missing=1
            fi
          done
          exit $missing

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Do not install the legacy "tools" package — it pulls the emulator
      # and triggers interactive / flaky license prompts on runners.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"

      - name: Compute version metadata
        id: meta
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${{ github.run_number }}"
          TAG="build-${{ github.run_number }}"
          APK="Log4OM-Android-${NAME}.apk"
          {
            echo "version_code=$CODE"
            echo "version_name=$NAME"
            echo "tag=$TAG"
            echo "apk_name=$APK"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$SRC"
          cp "$SRC" "dist/${{ steps.meta.outputs.apk_name }}"
          cp "$SRC" dist/Log4OM-Android-latest.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Log4OM Android ${{ steps.meta.outputs.version_name }}
          body: |
            Automated release from `main` (run #${{ github.run_number }}).

            - **Version:** ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.version_code }})
            - **Commit:** ${{ github.sha }}

            Download the APK below, or use the [download page](https://df3mt.github.io/Log4OM2-Android/).
          files: |
            dist/${{ steps.meta.outputs.apk_name }}
            dist/Log4OM-Android-latest.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    name: Publish download page
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render download page
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          TAG: ${{ needs.build.outputs.tag }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p site-out
          SHA_SHORT="${SHA:0:7}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          LATEST_ASSET="https://github.com/${REPO}/releases/latest/download/Log4OM-Android-latest.apk"
          VERSIONED_ASSET="https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}"
          REPO_URL="https://github.com/${REPO}"
          sed \
            -e "s|{{VERSION_NAME}}|${VERSION_NAME}|g" \
            -e "s|{{VERSION_CODE}}|${VERSION_CODE}|g" \
            -e "s|{{TAG}}|${TAG}|g" \
            -e "s|{{APK_NAME}}|${APK_NAME}|g" \
            -e "s|{{SHA_SHORT}}|${SHA_SHORT}|g" \
            -e "s|{{LATEST_ASSET}}|${LATEST_ASSET}|g" \
            -e "s|{{VERSIONED_ASSET}}|${VERSIONED_ASSET}|g" \
            -e "s|{{RELEASE_URL}}|${RELEASE_URL}|g" \
            -e "s|{{REPO_URL}}|${REPO_URL}|g" \
            site/index.template.html > site-out/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
