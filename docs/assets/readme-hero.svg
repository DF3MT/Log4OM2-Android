<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Log4OM Android">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2838"/>
      <stop offset="55%" stop-color="#0E1520"/>
      <stop offset="100%" stop-color="#0A1018"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2F6FED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2F6FED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8C9A0"/>
      <stop offset="100%" stop-color="#D4B48A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#night)"/>
  <ellipse cx="900" cy="40" rx="320" ry="160" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="56" fill="url(#sand)"/>
  <rect x="0" y="56" width="1200" height="3" fill="#C62828"/>

  <!-- Frequency wave -->
  <path d="M0 290 C120 250, 180 330, 300 290 S480 250, 600 290 S780 330, 900 290 S1080 250, 1200 290"
        fill="none" stroke="#2F6FED" stroke-width="2.5" opacity="0.85"/>
  <path d="M0 310 C120 280, 180 340, 300 310 S480 280, 600 310 S780 340, 900 310 S1080 280, 1200 310"
        fill="none" stroke="#E8C9A0" stroke-width="1.5" opacity="0.45"/>
  <path d="M0 330 C140 360, 200 300, 340 330 S520 360, 660 330 S840 300, 980 330 S1100 360, 1200 330"
        fill="none" stroke="#9AA8BC" stroke-width="1" opacity="0.35"/>

  <!-- Soft grid -->
  <g stroke="#2A3A50" stroke-width="1" opacity="0.35">
    <path d="M80 100 H1120"/>
    <path d="M80 140 H1120"/>
    <path d="M80 180 H600"/>
  </g>

  <text x="80" y="130" fill="#E8C9A0" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="4">COMPANION FOR LOG4OM2</text>
  <text x="80" y="210" fill="#F4F6F8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700">Log4OM Android</text>
  <text x="80" y="255" fill="#9AA8BC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26">Your logbook, from the phone  over MySQL</text>

  <rect x="80" y="290" width="168" height="44" rx="8" fill="#2F6FED"/>
  <text x="164" y="319" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Download</text>
</svg>
