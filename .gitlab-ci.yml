# Android in-app updates read this generic package (no token in the APK):
#   https://git.lets-host.de/api/v4/projects/df3mt%2FLog4OM2-Android/packages/generic/log4om-android/latest/release.json
#
# The project is private, so the Releases API is not reachable from a phone.
# ci/publish-android-release.sh publishes the APK and turns on anonymous pull.
# CI_JOB_TOKEN is used only on the runner.
#
# Signing variables — same names as the GitHub Actions secrets. The job stops
# before the build when any of them is missing:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#
# Version tags stay build-N (versionCode N, versionName 1.0.N). Each pipeline
# publishes max(latest GitHub build-N, latest GitLab package build-N) + 1.
# Set CI variable VERSION_CODE to override.
#
# API and web images are built here and deployed to the LXC at 192.168.96.191.
# Auto-DevOps is not used: this repo ships three artifacts (APK, api/, web/).
# Tag pipelines are skipped so the build-N release tag does not start another run.
#
# Deploy variables (Settings → CI/CD → Variables). Do not commit the key.
#   DEPLOY_SSH_PRIVATE_KEY   private key for root@192.168.96.191
#   DEPLOY_KNOWN_HOSTS       one line, from: ssh-keyscan -t ed25519 192.168.96.191
#                            192.168.96.191 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEz+Z/fMMt67j0iq4Cxa7GmiEgdJxOkhL/Xupi71N1P2
# Registry login on the LXC uses CI_REGISTRY_USER / CI_REGISTRY_PASSWORD (the job
# token) unless these overrides are set:
#   REGISTRY_USER
#   REGISTRY_PASSWORD        deploy token with read_registry
# main is a protected branch, so Protected variables are visible to these jobs.
# Mark the password variables masked. KEYSTORE_BASE64 is often too long to mask.

stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  DEPLOY_HOST: "192.168.96.191"
  DEPLOY_USER: "root"
  API_STACK_DIR: "/srv/log4om-api.df3mt.de"
  WEB_STACK_DIR: "/srv/log4om-web.df3mt.de"
  FF_USE_FASTZIP: "true"

.api_rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - ci/**/*
        - api/**/*

.web_rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - ci/**/*
        - web/**/*

android:release:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  resource_group: log4om-android-release
  interruptible: false
  timeout: 90m
  variables:
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
    PACKAGE_NAME: "log4om-android"
  cache:
    key: android-sdk-35-gradle
    paths:
      - .android-sdk/
      - .gradle/caches/
      - .gradle/wrapper/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - bash ci/publish-android-release.sh
  artifacts:
    name: "log4om-android-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths:
      - dist/
    when: on_success

# Until KEYSTORE_* exists, GitHub Actions still signs the switching build.
# Copy that APK here so the phone can keep updating after it leaves GitHub.
android:mirror-github:
  stage: build
  image: debian:bookworm-slim
  resource_group: log4om-android-release
  interruptible: false
  timeout: 30m
  variables:
    PACKAGE_NAME: "log4om-android"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KEYSTORE_BASE64 == null
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KEYSTORE_BASE64 == ""
  script:
    - bash ci/mirror-github-release.sh
  artifacts:
    name: "log4om-android-mirror-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths:
      - dist/
    when: on_success

api:test:
  stage: test
  image: eclipse-temurin:21-jdk-jammy
  extends: .api_rules
  interruptible: true
  timeout: 30m
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/api/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"
  cache:
    key:
      files:
        - api/gradle/wrapper/gradle-wrapper.properties
        - api/build.gradle.kts
    paths:
      - api/.gradle/caches/
      - api/.gradle/wrapper/
  script:
    - cd api
    - sed -i 's/\r$//' gradlew
    - chmod +x gradlew
    - ./gradlew test --no-daemon

web:check:
  stage: test
  image: node:22-alpine
  extends: .web_rules
  interruptible: true
  timeout: 20m
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
    NODE_OPTIONS: "--max-old-space-size=1024"
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
  script:
    - cd web
    - npm ci
    - npm run lint
    - npm run build

api:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  extends: .api_rules
  needs:
    - job: api:test
  interruptible: true
  timeout: 45m
  script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${CI_REGISTRY}" "${AUTH}" > /kaniko/.docker/config.json
      unset AUTH
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/api" \
        --dockerfile "${CI_PROJECT_DIR}/api/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}/api:latest"

web:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  extends: .web_rules
  needs:
    - job: web:check
  interruptible: true
  timeout: 45m
  script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${CI_REGISTRY}" "${AUTH}" > /kaniko/.docker/config.json
      unset AUTH
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/web" \
        --dockerfile "${CI_PROJECT_DIR}/web/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}/web:latest"

deploy:api:
  stage: deploy
  image: alpine:3.20
  extends: .api_rules
  needs:
    - job: api:image
  interruptible: false
  timeout: 15m
  before_script:
    - apk add --no-cache bash openssh-client
  script:
    - bash ci/deploy-stack.sh api

deploy:web:
  stage: deploy
  image: alpine:3.20
  extends: .web_rules
  needs:
    - job: web:image
  interruptible: false
  timeout: 15m
  before_script:
    - apk add --no-cache bash openssh-client
  script:
    - bash ci/deploy-stack.sh web
